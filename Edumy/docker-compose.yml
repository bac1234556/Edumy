services:
  database:
    build:
      context: ./Database
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-edumy}/edumy-database:${IMAGE_TAG:-latest}
    container_name: edumy_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    volumes:
      - edumy_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourPassword123' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mlservice:
    build:
      context: ./MLService
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-edumy}/edumy-mlservice:${IMAGE_TAG:-latest}
    container_name: edumy_mlservice
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-edumy}/edumy-backend:${IMAGE_TAG:-latest}
    container_name: edumy_backend
    ports:
      - "5000:5000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://database:1433;databaseName=EduMyDb;encrypt=false;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=YourPassword123
      - MACHINE_LEARNING_BASE_URL=http://mlservice:8000
    depends_on:
      database:
        condition: service_healthy
      mlservice:
        condition: service_started

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-edumy}/edumy-frontend:${IMAGE_TAG:-latest}
    container_name: edumy_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: edumy_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - edumy_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.4.1
    container_name: edumy_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - edumy_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  edumy_sqlserver_data:
  edumy_prometheus_data:
  edumy_grafana_data:
