services:
  database:
    build:
      context: ./Database
      dockerfile: Dockerfile
    container_name: edumy_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    volumes:
      - edumy_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourPassword123' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mlservice:
    build:
      context: ./MLService
      dockerfile: Dockerfile
    container_name: edumy_mlservice
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: edumy_backend
    ports:
      - "5000:5000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://database:1433;databaseName=EduMyDb;encrypt=false;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=YourPassword123
      - MACHINE_LEARNING_BASE_URL=http://mlservice:8000
    depends_on:
      database:
        condition: service_healthy
      mlservice:
        condition: service_started

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: edumy_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  edumy_sqlserver_data:
