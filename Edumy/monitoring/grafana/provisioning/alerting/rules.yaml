apiVersion: 1

groups:
  - orgId: 1
    name: 'Edumy Backend Alerts'
    folder: 'Edumy Alerts'
    interval: 10s
    rules:
      - uid: backend-down-alert
        title: 'Máy chủ Backend ngưng hoạt động (Down)'
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: count(up{job="edumy-backend"} == 1) or vector(0)
              instant: true
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          summary: '🚨 Máy chủ Backend EduMy ĐANG BỊ SẬP (DOWN)!'
          description: 'Dịch vụ Spring Boot (http://backend:5000) không phản hồi hoặc mất kết nối cơ sở dữ liệu. Vui lòng kiểm tra container edumy_backend.'
        labels:
          severity: critical

      - uid: backend-high-cpu-alert
        title: 'CPU Máy chủ Backend vượt ngưỡng 85%'
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (process_cpu_usage{job="edumy-backend"} * 100) or vector(0)
              instant: true
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 1m
        annotations:
          summary: '⚠️ CPU Máy chủ Backend vượt quá 85%'
          description: 'Tiến trình Spring Boot đang sử dụng hơn 85% CPU liên tục trong hơn 1 phút. Cần kiểm tra tiến trình để tránh quá tải.'
        labels:
          severity: warning

      - uid: backend-5xx-errors-alert
        title: 'Phát hiện lỗi hệ thống HTTP 5xx'
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(rate(http_server_requests_seconds_count{job="edumy-backend",status=~"5.."}[1m])) or vector(0)
              instant: true
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          summary: '🚨 Phát hiện lỗi hệ thống HTTP 5xx từ API Backend!'
          description: 'Hệ thống ghi nhận API Backend trả về mã lỗi 500/502/503 cho người dùng. Cần kiểm tra log backend để xử lý ngoại lệ.'
        labels:
          severity: critical
