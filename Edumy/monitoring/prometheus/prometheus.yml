global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'edumy-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:5000']
        labels:
          application: 'Edumy Backend'
          environment: 'local-docker'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

