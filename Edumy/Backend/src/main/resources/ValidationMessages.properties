# Vietnamese Bean Validation texts (docs/ai/05 §5.2 "Validation messages"). UTF-8. Default bundle (no _vi suffix), so
# it applies whatever the request locale is. The jakarta.* keys override the English defaults of Hibernate Validator
# for every built-in constraint (P05-0), so DTOs need no per-field message in the common case; the edumy.* keys are
# explicit messages ({key} in the annotation) for rule-specific texts.
jakarta.validation.constraints.AssertFalse.message=Giá trị phải là false
jakarta.validation.constraints.AssertTrue.message=Giá trị phải là true
jakarta.validation.constraints.DecimalMax.message=Giá trị phải nhỏ hơn ${inclusive == true ? 'hoặc bằng ' : ''}{value}
jakarta.validation.constraints.DecimalMin.message=Giá trị phải lớn hơn ${inclusive == true ? 'hoặc bằng ' : ''}{value}
jakarta.validation.constraints.Digits.message=Giá trị vượt quá giới hạn (tối đa {integer} chữ số phần nguyên, {fraction} chữ số phần thập phân)
jakarta.validation.constraints.Email.message=Email không đúng định dạng
jakarta.validation.constraints.Future.message=Phải là thời điểm trong tương lai
jakarta.validation.constraints.FutureOrPresent.message=Phải là thời điểm hiện tại hoặc trong tương lai
jakarta.validation.constraints.Max.message=Giá trị tối đa là {value}
jakarta.validation.constraints.Min.message=Giá trị tối thiểu là {value}
jakarta.validation.constraints.Negative.message=Giá trị phải nhỏ hơn 0
jakarta.validation.constraints.NegativeOrZero.message=Giá trị phải nhỏ hơn hoặc bằng 0
jakarta.validation.constraints.NotBlank.message=Không được để trống
jakarta.validation.constraints.NotEmpty.message=Không được để trống
jakarta.validation.constraints.NotNull.message=Không được để trống
jakarta.validation.constraints.Null.message=Phải để trống
jakarta.validation.constraints.Past.message=Phải là thời điểm trong quá khứ
jakarta.validation.constraints.PastOrPresent.message=Phải là thời điểm hiện tại hoặc trong quá khứ
jakarta.validation.constraints.Pattern.message=Không đúng định dạng
jakarta.validation.constraints.Positive.message=Giá trị phải lớn hơn 0
