validation.type-mismatch=Giá trị không đúng định dạng
error.CERTIFICATE_PDF_FAILED.title=Không tạo được tệp PDF chứng chỉ
error.CERTIFICATE_PDF_FAILED.detail=Đã có lỗi khi tạo tệp PDF; chứng chỉ của bạn không thay đổi. Vui lòng thử lại sau.
error.SERVICE_UNAVAILABLE.title=Hệ thống tạm thời không phục vụ được
error.SERVICE_UNAVAILABLE.detail=Không kết nối được cơ sở dữ liệu. Vui lòng thử lại sau ít phút.
error.QA_QUESTION_DUPLICATE.title=Câu hỏi vừa được gửi
error.QA_QUESTION_DUPLICATE.detail=Bạn vừa gửi câu hỏi có cùng tiêu đề và nội dung. Vui lòng đợi một phút nếu muốn gửi lại.
