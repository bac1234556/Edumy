# Vietnamese texts for shared.error.ErrorCode (docs/ai/05-api-contract.md §5.2). UTF-8.
# Keys: error.<CODE>.title / error.<CODE>.detail. Placeholders {0}, {1} use java.text.MessageFormat:
# write '' for a literal apostrophe and pass ids as String.

error.VALIDATION_FAILED.title=Dữ liệu không hợp lệ
error.VALIDATION_FAILED.detail=Một hoặc nhiều trường dữ liệu không hợp lệ, xem danh sách lỗi.
error.MALFORMED_REQUEST.title=Yêu cầu không hợp lệ
error.MALFORMED_REQUEST.detail=Yêu cầu sai định dạng hoặc không được hỗ trợ.
error.UNAUTHENTICATED.title=Chưa đăng nhập
error.UNAUTHENTICATED.detail=Vui lòng đăng nhập để tiếp tục.
error.ACCESS_DENIED.title=Không có quyền
error.ACCESS_DENIED.detail=Bạn không có quyền thực hiện thao tác này.
error.RESOURCE_NOT_FOUND.title=Không tìm thấy
error.RESOURCE_NOT_FOUND.detail=Không tìm thấy tài nguyên được yêu cầu.
error.DATA_CONFLICT.title=Xung đột dữ liệu
error.DATA_CONFLICT.detail=Dữ liệu đã thay đổi hoặc bị trùng, vui lòng tải lại và thử lại.
error.RATE_LIMITED.title=Quá nhiều yêu cầu
error.RATE_LIMITED.detail=Bạn thao tác quá nhanh, vui lòng thử lại sau.
error.INTERNAL_ERROR.title=Lỗi hệ thống
error.INTERNAL_ERROR.detail=Đã có lỗi xảy ra, vui lòng thử lại sau.

error.AUTH_INVALID_CREDENTIALS.title=Sai thông tin đăng nhập
error.AUTH_INVALID_CREDENTIALS.detail=Email hoặc mật khẩu không đúng.
error.AUTH_LOGIN_TEMPORARILY_BLOCKED.title=Tạm khóa đăng nhập
error.AUTH_LOGIN_TEMPORARILY_BLOCKED.detail=Bạn đã đăng nhập sai quá nhiều lần, vui lòng thử lại sau.
error.AUTH_ACCOUNT_LOCKED.title=Tài khoản đã bị khóa
error.AUTH_ACCOUNT_LOCKED.detail=Tài khoản của bạn đã bị khóa, vui lòng liên hệ quản trị viên.
error.EMAIL_NOT_VERIFIED.title=Email chưa được xác thực
error.EMAIL_NOT_VERIFIED.detail=Vui lòng xác thực email trước khi thực hiện thao tác này.
error.EMAIL_ALREADY_REGISTERED.title=Email đã được sử dụng
error.EMAIL_ALREADY_REGISTERED.detail=Email này đã được đăng ký. Vui lòng đăng nhập hoặc dùng chức năng quên mật khẩu.
error.ACCOUNT_TOKEN_INVALID.title=Liên kết không còn hiệu lực
error.ACCOUNT_TOKEN_INVALID.detail=Liên kết không hợp lệ, đã được sử dụng hoặc đã hết hạn. Vui lòng yêu cầu gửi lại.
error.TOKEN_RESEND_TOO_SOON.title=Vui lòng chờ trước khi gửi lại
error.TOKEN_RESEND_TOO_SOON.detail=Mã vừa được gửi. Vui lòng chờ 60 giây rồi thử lại.
error.PASSWORD_INCORRECT.title=Mật khẩu hiện tại không đúng
error.PASSWORD_INCORRECT.detail=Mật khẩu hiện tại bạn nhập không đúng.
error.PASSWORD_SAME_AS_OLD.title=Mật khẩu mới trùng mật khẩu cũ
error.PASSWORD_SAME_AS_OLD.detail=Mật khẩu mới phải khác mật khẩu hiện tại.
error.INSTRUCTOR_ROLE_REVOKED.title=Không thể đăng ký làm giảng viên
error.INSTRUCTOR_ROLE_REVOKED.detail=Quyền giảng viên của bạn đã bị quản trị viên thu hồi. Vui lòng liên hệ quản trị viên.
error.ADMIN_LAST_ACTIVE.title=Không thể thực hiện
error.ADMIN_LAST_ACTIVE.detail=Hệ thống phải còn ít nhất một quản trị viên đang hoạt động (BR-36).
error.ADMIN_LOCK_FORBIDDEN.title=Không thể khóa tài khoản này
error.ADMIN_LOCK_FORBIDDEN.detail=Quản trị viên không được khóa chính mình hoặc quản trị viên khác (BR-36).
error.ACCOUNT_ALREADY_LOCKED.title=Tài khoản đã bị khóa
error.ACCOUNT_ALREADY_LOCKED.detail=Tài khoản này đang bị khóa, không thể khóa lại.
error.ACCOUNT_NOT_LOCKED.title=Tài khoản không bị khóa
error.ACCOUNT_NOT_LOCKED.detail=Tài khoản này đang hoạt động, không cần mở khóa.
error.INSTRUCTOR_ROLE_ALREADY_ACTIVE.title=Đã có quyền giảng viên
error.INSTRUCTOR_ROLE_ALREADY_ACTIVE.detail=Tài khoản này đã có vai trò giảng viên còn hiệu lực.
error.INSTRUCTOR_ROLE_NOT_ACTIVE.title=Không có quyền giảng viên
error.INSTRUCTOR_ROLE_NOT_ACTIVE.detail=Tài khoản này không có vai trò giảng viên còn hiệu lực, không có gì để thu hồi.
error.ACCOUNT_LOCKED_TARGET.title=Tài khoản đang bị khóa
error.ACCOUNT_LOCKED_TARGET.detail=Không thể cấp quyền giảng viên cho tài khoản đang bị khóa. Hãy mở khóa tài khoản trước.

error.COURSE_NOT_EDITABLE.title=Khóa học đang chờ duyệt, không thể chỉnh sửa
error.COURSE_NOT_EDITABLE.detail=Khóa học đang ở trạng thái chờ duyệt nên không thể chỉnh sửa (BR-33).
error.COURSE_SUBMIT_CHECKLIST_FAILED.title=Khóa học chưa đủ điều kiện gửi duyệt
error.COURSE_SUBMIT_CHECKLIST_FAILED.detail=Khóa học chưa đạt một số mục trong danh sách kiểm tra, xem danh sách lỗi (BR-07).
error.COURSE_CO_INSTRUCTOR_IS_MAIN.title=Không thể mời giảng viên chính làm đồng giảng viên
error.COURSE_CO_INSTRUCTOR_IS_MAIN.detail=Người được mời là giảng viên chính của khóa học này (BR-02).
error.COURSE_DELETE_FORBIDDEN.title=Không thể xóa khóa học đã từng công khai
error.COURSE_DELETE_FORBIDDEN.detail=Khóa học đã từng được công khai nên không thể xóa, chỉ có thể ẩn (BR-19).
error.LESSON_COURSE_MISMATCH.title=Bài học không thuộc khóa học này
error.LESSON_COURSE_MISMATCH.detail=Bài học được chọn không thuộc khóa học của ghi danh (BR-24, BR-37).
error.COURSE_CATEGORY_UNAVAILABLE.title=Danh mục không khả dụng
error.COURSE_CATEGORY_UNAVAILABLE.detail=Danh mục được chọn không tồn tại hoặc đã ngừng sử dụng, vui lòng chọn danh mục khác.
error.CATEGORY_ALREADY_EXISTS.title=Danh mục đã tồn tại
error.CATEGORY_ALREADY_EXISTS.detail=Đã có danh mục trùng tên hoặc trùng slug, vui lòng chọn tên hoặc slug khác.
error.COURSE_LAST_LESSON_DELETE_FORBIDDEN.title=Không thể xóa bài học cuối cùng của khóa học
error.COURSE_LAST_LESSON_DELETE_FORBIDDEN.detail=Khóa học đã công khai phải luôn còn ít nhất một bài học, hãy thêm bài học khác trước khi xóa (D-14).
error.COURSE_CO_INSTRUCTOR_NOT_ELIGIBLE.title=Tài khoản chưa đăng ký làm giảng viên
error.COURSE_CO_INSTRUCTOR_NOT_ELIGIBLE.detail=Không thể mời email này: tài khoản chưa đăng ký làm giảng viên hoặc không có vai trò giảng viên còn hiệu lực.
error.COURSE_CO_INSTRUCTOR_ALREADY_INVITED.title=Giảng viên đã được mời
error.COURSE_CO_INSTRUCTOR_ALREADY_INVITED.detail=Giảng viên này đang chờ phản hồi lời mời hoặc đã là đồng giảng viên của khóa học.
error.INVITATION_NOT_PENDING.title=Lời mời không còn hiệu lực
error.INVITATION_NOT_PENDING.detail=Lời mời đã bị thu hồi hoặc đã được phản hồi trước đó.
error.INVITATION_RESEND_TOO_SOON.title=Vui lòng chờ trước khi gửi lại thư mời
error.INVITATION_RESEND_TOO_SOON.detail=Thư mời vừa được gửi. Vui lòng chờ 60 giây rồi thử lại.
error.LESSON_CONTENT_REQUIRED.title=Bài học chưa có nội dung
error.LESSON_CONTENT_REQUIRED.detail=Khóa học đã công khai nên bài học phải có nội dung: bài video cần đường dẫn video, bài viết cần nội dung bài viết.
error.COURSE_MAIN_INSTRUCTOR_LEAVE_FORBIDDEN.title=Giảng viên chính không thể rời khóa học
error.COURSE_MAIN_INSTRUCTOR_LEAVE_FORBIDDEN.detail=Giảng viên chính luôn gắn với khóa học và không thể rời khỏi khóa (BR-02).
error.COURSE_INVALID_TRANSITION.title=Trạng thái khóa học không cho phép thao tác này
error.COURSE_INVALID_TRANSITION.detail=Khóa học không còn ở trạng thái phù hợp (có thể đã được xử lý trước đó), vui lòng tải lại để xem trạng thái hiện tại.

error.CART_COURSE_ALREADY_OWNED.title=Bạn đã sở hữu khóa học này
error.CART_COURSE_ALREADY_OWNED.detail=Khóa học đã có trong danh sách khóa học của bạn (BR-10).
error.CART_OWN_COURSE.title=Không thể mua khóa học của chính mình
error.CART_OWN_COURSE.detail=Bạn là giảng viên của khóa học này nên không thể thêm vào giỏ hàng (BR-32).
error.CART_COURSE_FREE.title=Khóa học miễn phí không cần thêm vào giỏ hàng
error.CART_COURSE_FREE.detail=Khóa học miễn phí được ghi danh trực tiếp, không qua giỏ hàng và thanh toán (BR-09).
error.CART_ITEM_DUPLICATE.title=Khóa học đã có trong giỏ hàng
error.CART_ITEM_DUPLICATE.detail=Khóa học này đã có trong giỏ hàng của bạn (BR-11).
error.CART_EMPTY.title=Giỏ hàng trống
error.CART_EMPTY.detail=Giỏ hàng không còn khóa học hợp lệ nào để tạo đơn hàng (BR-27).
error.ORDER_CART_CHANGED.title=Giỏ hàng đã thay đổi
error.ORDER_CART_CHANGED.detail=Danh sách khóa học hoặc tổng tiền đã thay đổi so với lúc bạn xem. Vui lòng kiểm tra lại giỏ hàng rồi xác nhận lại.
error.ORDER_ALREADY_PAID.title=Đơn hàng đã được thanh toán
error.ORDER_ALREADY_PAID.detail=Thanh toán của đơn hàng đã được ghi nhận và khóa học đã được thêm vào danh sách của bạn. Vui lòng xem lại giỏ hàng.
error.ORDER_EXPIRED.title=Đơn hàng đã quá hạn thanh toán
error.ORDER_EXPIRED.detail=Đơn hàng chờ thanh toán quá 24 giờ nên đã được hủy. Vui lòng tạo đơn mới từ giỏ hàng.
error.PAYMENT_PROVIDER_UNAVAILABLE.title=Dịch vụ thanh toán tạm thời không phản hồi
error.PAYMENT_PROVIDER_UNAVAILABLE.detail=Không kết nối được dịch vụ thanh toán; đơn hàng và giỏ hàng được giữ nguyên. Vui lòng thử lại sau.

error.ENROLLMENT_REQUIRED.title=Chưa ghi danh khóa học
error.ENROLLMENT_REQUIRED.detail=Bạn cần ghi danh khóa học để thực hiện thao tác này.
error.ENROLLMENT_COURSE_NOT_FREE.title=Khóa học này không miễn phí
error.ENROLLMENT_COURSE_NOT_FREE.detail=Chỉ khóa học miễn phí mới được ghi danh trực tiếp; khóa học trả phí cần thêm vào giỏ hàng và thanh toán (BR-09).
error.ENROLLMENT_OWN_COURSE.title=Bạn đã có quyền xem khóa học này
error.ENROLLMENT_OWN_COURSE.detail=Bạn là giảng viên của khóa học này nên đã có quyền xem nội dung với tư cách giảng viên, không cần ghi danh (BR-32).
error.REVIEW_HIDDEN_BY_ADMIN.title=Đánh giá đã bị ẩn
error.REVIEW_HIDDEN_BY_ADMIN.detail=Đánh giá đã bị quản trị viên ẩn nên không thể chỉnh sửa (BR-35).
error.QA_CONTENT_HIDDEN_BY_ADMIN.title=Nội dung hỏi đáp đã bị ẩn
error.QA_CONTENT_HIDDEN_BY_ADMIN.detail=Câu hỏi hoặc phản hồi đã bị quản trị viên ẩn nên không thể chỉnh sửa, xóa hay trả lời tiếp (BR-41).
error.QA_REPLY_NOT_ALLOWED.title=Không thể trả lời câu hỏi
error.QA_REPLY_NOT_ALLOWED.detail=Chỉ giảng viên của khóa học và người đặt câu hỏi được trả lời (BR-38).

