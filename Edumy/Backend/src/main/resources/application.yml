spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=EduMyDb;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8;useUnicode=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:YourPassword123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.SQLServerDialect
        connection:
          characterEncoding: UTF-8
          useUnicode: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: ${PORT:5000}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

jwt:
  key: ${JWT_SECRET:ThisIsASecretKeyForJwtAuthenticationInEduMyProject_PleaseChangeInProduction}
  issuer: ${JWT_ISSUER:EduMyBackend}
  audience: ${JWT_AUDIENCE:EduMyClient}
  expire-days: ${JWT_EXPIRE_DAYS:7}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

payment:
  vietqr:
    bank-id: ${VIETQR_BANK_ID:BIDV}
    bank-name: ${VIETQR_BANK_NAME:BIDV (Ngân hàng TMCP Đầu tư và Phát triển Việt Nam)}
    account-no: ${VIETQR_ACCOUNT_NO:96247BAC206}
    account-name: ${VIETQR_ACCOUNT_NAME:LE VIET BAC}
    template: ${VIETQR_TEMPLATE:compact2}
  webhook:
    api-key: ${PAYMENT_WEBHOOK_API_KEY:edumy_sepay_webhook_secret_key_2026}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:EDUMY01}
    hash-secret: ${VNPAY_HASH_SECRET:edumy_vnpay_secret_key_2026_super_secure_checksum_key}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}

machine-learning:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    com.edumy.backend: INFO
