spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=EduMyDb;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8;useUnicode=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:YourPassword123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.SQLServerDialect
        connection:
          characterEncoding: UTF-8
          useUnicode: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    serialization:
      fail-on-empty-beans: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

edumy:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  time-zone: ${EDUMY_TIME_ZONE:Asia/Ho_Chi_Minh}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:19006}
  mail:
    from: ${MAIL_FROM:Edumy Academy <no-reply@edumy.vn>}
  payout:
    platform-fee-bps: ${PAYOUT_PLATFORM_FEE_BPS:3000}
    min-withdrawal: ${PAYOUT_MIN_WITHDRAWAL:100000}
    hold-days: ${PAYOUT_HOLD_DAYS:7}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${PORT:5000}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

jwt:
  key: ${JWT_SECRET:ThisIsASecretKeyForJwtAuthenticationInEduMyProject_PleaseChangeInProduction}
  issuer: ${JWT_ISSUER:EduMyBackend}
  audience: ${JWT_AUDIENCE:EduMyClient}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
  expire-days: ${JWT_EXPIRE_DAYS:7}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

payment:
  vietqr:
    bank-id: ${VIETQR_BANK_ID:BIDV}
    bank-name: ${VIETQR_BANK_NAME:BIDV (Ngân hàng TMCP Đầu tư và Phát triển Việt Nam)}
    account-no: ${VIETQR_ACCOUNT_NO:96247BAC206}
    account-name: ${VIETQR_ACCOUNT_NAME:LE VIET BAC}
    template: ${VIETQR_TEMPLATE:compact2}
  webhook:
    api-key: ${PAYMENT_WEBHOOK_API_KEY:edumy_sepay_webhook_secret_key_2026}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:EDUMY01}
    hash-secret: ${VNPAY_HASH_SECRET:edumy_vnpay_secret_key_2026_super_secure_checksum_key}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}



logging:
  level:
    root: INFO
    org.springframework.web: WARN
    com.edumy.backend: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: edumy-backend

