spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:edumy;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

edumy:
  auth:
    expose-reset-token: ${EDUMY_AUTH_EXPOSE_RESET_TOKEN:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${EDUMY_JWT_SECRET:}
    issuer: ${EDUMY_JWT_ISSUER:edumy}
    audience: ${EDUMY_JWT_AUDIENCE:edumy-api}
    expire-minutes: ${EDUMY_JWT_EXPIRE_MINUTES:15}
