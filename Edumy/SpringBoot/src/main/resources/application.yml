spring:
  application:
    name: edumy-spring
  datasource:
    url: "${EDUMY_DB_URL:jdbc:postgresql://localhost:5432/Edumy}"
    username: "${EDUMY_DB_USERNAME:postgres}"
    password: "${EDUMY_DB_PASSWORD:06072004}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: "${PORT:8081}"
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

edumy:
  auth:
    expose-reset-token: "${EDUMY_AUTH_EXPOSE_RESET_TOKEN:false}"
  google:
    client-id: "${GOOGLE_CLIENT_ID:}"
  jwt:
    secret: "${EDUMY_JWT_SECRET:dev-secret-key-must-be-at-least-32-bytes-long!}"
    issuer: "${EDUMY_JWT_ISSUER:edumy}"
    audience: "${EDUMY_JWT_AUDIENCE:edumy-api}"
    expire-minutes: "${EDUMY_JWT_EXPIRE_MINUTES:15}"
